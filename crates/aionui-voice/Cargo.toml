[package]
name = "aionui-voice"
version.workspace = true
edition.workspace = true

[features]
# Test seam (PLAN §4): honours AIONUI_VOICE_FAKE_PROVIDER_URL and builds the
# in-process fake OpenAI Realtime provider. Never enabled in release builds.
voice-test = []

[dependencies]
aionui-api-types.workspace = true
aionui-auth.workspace = true
aionui-common.workspace = true
aionui-db.workspace = true
# Voice sockets are registered in a dedicated WebSocketManager and written by
# its shared send loop.
aionui-realtime.workspace = true
# Shared OpenAI base-URL normalisation, the rustls WebSocket connector and
# the OpenAI transcription client (read-back name check).
aionui-shell.workspace = true
# Project containment + canonical paths for the read tools.
aionui-project.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
dashmap.workspace = true
futures-util.workspace = true
hex.workspace = true
ignore.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tempfile.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
tracing-subscriber.workspace = true

# Integration tests: one binary, tests/it/main.rs; its voice modules are gated on
# `voice-test` (run with `--features voice-test`).
