# cargo-nextest configuration (TASK-110). Pinned runner version: see `nextest-version`
# below, the `test` recipe in the justfile and .github/workflows/gate.yml.
#
# nextest runs every test in its own process, so tests never share process
# globals (env vars, statics) with each other. Doctests are not run by nextest:
# `just test` runs `cargo test --doc` after it.

nextest-version = { required = "0.9.100", recommended = "0.9.152" }

[profile.default]
# No blanket retries: a flaky test is fixed or ignored with a reason, not hidden.
retries = 0
# Flag a test as slow after 60 s; kill it after 5 periods (5 min).
slow-timeout = { period = "60s", terminate-after = 5 }
# Report every failure in one run.
fail-fast = false

[profile.ci]
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "slow"

